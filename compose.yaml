name: bento-demo

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.4
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  console:
    image: docker.redpanda.com/redpandadata/console:v3.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092

  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: bento
      POSTGRES_PASSWORD: bento
      POSTGRES_DB: assurance
    ports:
      - "15432:5432"
    volumes:
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,Z
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U bento -d assurance"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  redpanda-data:
  postgres-data:
